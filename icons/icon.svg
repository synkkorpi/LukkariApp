<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#fb8c00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#33333e" stroke-width="4"/>

  <!-- Calendar Base Card -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="112" width="320" height="300" rx="24" fill="#1e1e1e" stroke="#33333e" stroke-width="3"/>
    
    <!-- Calendar Top Bar -->
    <rect x="96" y="112" width="320" height="72" rx="24" fill="url(#headerGrad)"/>
    <rect x="96" y="160" width="320" height="24" fill="url(#headerGrad)"/> <!-- Fill bottom rounded corners of top bar -->

    <!-- Binder rings -->
    <rect x="160" y="92" width="20" height="40" rx="10" fill="#e0e0e0"/>
    <rect x="246" y="92" width="20" height="40" rx="10" fill="#e0e0e0"/>
    <rect x="332" y="92" width="20" height="40" rx="10" fill="#e0e0e0"/>

    <!-- Header Text representation / dots -->
    <circle cx="136" cy="148" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="156" cy="148" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="176" cy="148" r="6" fill="#ffffff" opacity="0.8"/>
    <rect x="290" y="142" width="90" height="12" rx="6" fill="#ffffff" opacity="0.9"/>

    <!-- Event Cards representation on calendar -->
    <!-- Event 1 (Green/Treenit) -->
    <rect x="120" y="208" width="272" height="48" rx="12" fill="#252525" stroke="#4caf50" stroke-width="2"/>
    <rect x="120" y="208" width="8" height="48" rx="4" fill="url(#greenGrad)"/>
    <rect x="144" y="222" width="70" height="10" rx="5" fill="#4caf50"/>
    <rect x="144" y="238" width="130" height="8" rx="4" fill="#a0a0a0"/>

    <!-- Event 2 (Blue/Koulu) -->
    <rect x="120" y="272" width="272" height="48" rx="12" fill="#252525" stroke="#2196f3" stroke-width="2"/>
    <rect x="120" y="272" width="8" height="48" rx="4" fill="url(#headerGrad)"/>
    <rect x="144" y="286" width="90" height="10" rx="5" fill="#2196f3"/>
    <rect x="144" y="302" width="160" height="8" rx="4" fill="#a0a0a0"/>

    <!-- Event 3 (Orange/Muu) -->
    <rect x="120" y="336" width="272" height="48" rx="12" fill="#252525" stroke="#ff9800" stroke-width="2"/>
    <rect x="120" y="336" width="8" height="48" rx="4" fill="url(#orangeGrad)"/>
    <rect x="144" y="350" width="60" height="10" rx="5" fill="#ff9800"/>
    <rect x="144" y="366" width="100" height="8" rx="4" fill="#a0a0a0"/>
  </g>
</svg>
