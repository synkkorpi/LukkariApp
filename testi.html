<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datan haun testaus (Tumma teema)</title>
    <style>
        /* --- Tumman teeman tyylit --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-blue: #2196f3;
            --accent-green: #4caf50;
            --accent-orange: #ff9800;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            max-width: 600px;
            text-align: center;
        }

        .status-loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #data-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Tapahtumakortin tyylit --- */
        .event-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Värikoodattu pystyviiva reunaan */
        .event-card.Koulu { border-left: 5px solid var(--accent-blue); }
        .event-card.Treenit { border-left: 5px solid var(--accent-green); }
        .event-card.Muu { border-left: 5px solid var(--accent-orange); }

        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .event-time {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--text-primary);
        }

        .event-name {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-right: 10px;
        }

        .event-subject {
            font-size: 1.2em;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .event-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        pre {
            background: #333;
            padding: 10px;
            overflow-x: auto;
            border-radius: 5px;
            font-size: 0.8em;
            color: #ddd;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
            display: none; /* Piilotettu oletuksena, näytetään jos haku epäonnistuu */
        }

    </style>
</head>
<body>

    <h1>Lukujärjestyksen testaus</h1>
    <div id="status" class="status-loading">Haetaan dataa Google Sheetsistä...</div>

    <!-- Tähän diviin JavaScript piirtää tapahtumat -->
    <div id="data-container">
        <!-- Esimerkki miltä kortti näyttää staattisena: -->
        <!-- 
        <div class="event-card Koulu">
            <div class="event-header">
                <span class="event-time">08:00 - 13:45</span>
                <div>
                    <span class="event-name">Maija</span>
                </div>
            </div>
            <div class="event-subject">Koulu</div>
            <div class="event-meta">
                <span>Luokka 4B</span>
                <span>Toistuu: joka viikko</span>
            </div>
        </div> 
        -->
    </div>
    
    <!-- Jos tulee virhe, raaka JSON näytetään tässä -->
    <pre id="raw-json"></pre>

    <script>
        // --- ASETUKSET ---
        // KORVAA TÄHEN OMA WEB APP URL -OSOITTEESI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtexVQWuAtTGr9qbgrwTmJK2lZCCkdrS7tqCG4mSggkxfyIEofiSHGYDT6QJZBW2-S/exec";

        // --- JAVASCRIPT LOGIIKKA ---
        
        async function haeData() {
            const statusDiv = document.getElementById('status');
            const container = document.getElementById('data-container');
            const rawJson = document.getElementById('raw-json');

            try {
                // Suoritetaan GET-pyyntö Apps Scriptille
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();

                if (result.status === "success") {
                    statusDiv.textContent = "Datan haku onnistui! (Yhteensä " + result.data.length + " riviä)";
                    statusDiv.className = "status-success";
                    
                    // Piirretään data kortteina
                    naytaDataKortteina(result.data, container);

                    // Jos haluat nähdä raakadata konsolissa, poista kommentti:
                    // console.log("Saatu data:", result.data);

                } else {
                    throw new Error(result.message || "Tuntematon virhe Apps Scriptissä");
                }

            } catch (error) {
                statusDiv.textContent = "Virhe datan haussa: " + error.message;
                statusDiv.className = "status-error";
                console.error('Virhe:', error);
                
                // Näytetään virheviesti myös raakajson-kentässä
                rawJson.textContent = "Virhetiedot:\n" + error.toString();
                rawJson.style.display = "block";
            }
        }

        // Funktio, joka muuttaa JSON-datan HTML-korteiksi
        function naytaDataKortteina(data, container) {
            container.innerHTML = ''; // Tyhjennetään ensin loading-teksti

            if (data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Ei tulevia tapahtumia taulukossa.</p>';
                return;
            }

            // Järjestetään data aikajärjestykseen (valinnainen)
            data.sort((a, b) => {
                if (a.Päivämäärä !== b.Päivämäärä) {
                    return (new Date(a.Päivämäärä)) - (new Date(b.Päivämäärä));
                }
                // Jos sama päivä, verrataan alkamisaikaa (merkkijonoina toimii tässä formaatissa)
                return a.Alkamisaika.localeCompare(b.Alkamisaika);
            });

            data.forEach(rivi => {
                // Ohitetaan tyhjät rivit
                if (!rivi.Aihe) return;

                const card = document.createElement('div');
                card.className = 'event-card';
                
                // Luokka tyylittelyä varten (esim. Aihe-sarakkeen perusteella)
                if (rivi.Aihe.includes('Koulu')) {
                    card.classList.add('Koulu');
                } else if (rivi.Aihe.includes('tre')) {
                    card.classList.add('Treenit');
                } else {
                    card.classList.add('Muu');
                }

                // Muotoillaan päivämäärä siistimmäksi (esim. suomalaiseen tyyliin)
                let pvmTeksti = rivi.Päivämäärä;
                try {
                   const pvmObj = new Date(rivi.Päivämäärä);
                   if(!isNaN(pvmObj.getTime())) {
                       pvmTeksti = pvmObj.toLocaleDateString('fi-FI');
                   }
                } catch (e) {}

                card.innerHTML = `
                    <div class="event-header">
                        <div>
                            <span class="event-time">${rivi.Alkamisaika} - ${rivi.Loppumisaika}</span>
                            <span class="event-name">(${rivi.Nimi})</span>
                        </div>
                         <span class="event-date">${pvmTeksti}</span>
                    </div>
                    <div class="event-subject">${rivi.Aihe}</div>
                    <div class="event-meta">
                        <span>${rivi.Toistuvuus || ''}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Suoritetaan haku sivun latautuessa
        haeData();

    </script>
</body>
</html>
